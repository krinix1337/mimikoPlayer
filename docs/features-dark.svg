<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="540" viewBox="0 0 1280 540" font-family="'Segoe UI', Inter, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A1C21"/>
      <stop offset="1" stop-color="#15171B"/>
    </linearGradient>
    <g id="box">
      <rect width="396" height="236" rx="24" fill="url(#card)" stroke="#262A30"/>
      <rect x="28" y="28" width="52" height="52" rx="16" fill="#252A18" stroke="#3A4320"/>
    </g>
  </defs>

  <rect width="1280" height="540" rx="28" fill="#0F1012"/>

  <g stroke="#D8F544" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- 01 Волна -->
    <g transform="translate(24 24)">
      <use href="#box"/>
      <path d="M40 54 q6 -14 12 0 t12 0 t12 0"/>
    </g>
    <!-- 02 Плеер -->
    <g transform="translate(442 24)">
      <use href="#box"/>
      <path d="M48 42 l16 12 l-16 12 z" fill="#D8F544"/>
    </g>
    <!-- 03 Коллекция -->
    <g transform="translate(860 24)">
      <use href="#box"/>
      <path d="M54 66 c-12 -8 -16 -14 -12 -20 c3 -5 9 -5 12 0 c3 -5 9 -5 12 0 c4 6 0 12 -12 20 z"/>
    </g>
    <!-- 04 Караоке -->
    <g transform="translate(24 280)">
      <use href="#box"/>
      <rect x="48" y="40" width="12" height="18" rx="6"/>
      <path d="M43 54 a11 11 0 0 0 22 0 M54 65 v5"/>
    </g>
    <!-- 05 Источники -->
    <g transform="translate(442 280)">
      <use href="#box"/>
      <path d="M54 40 l14 7 l-14 7 l-14 -7 z M40 55 l14 7 l14 -7 M40 62 l14 7 l14 -7"/>
    </g>
    <!-- 06 Оформление -->
    <g transform="translate(860 280)">
      <use href="#box"/>
      <circle cx="54" cy="54" r="13"/>
      <circle cx="49" cy="49" r="2" fill="#D8F544"/>
      <circle cx="59" cy="49" r="2" fill="#D8F544"/>
      <circle cx="48" cy="58" r="2" fill="#D8F544"/>
    </g>
  </g>

  <g font-size="44" font-weight="800" fill="#2E3418" text-anchor="end">
    <text x="392" y="94">01</text>
    <text x="810" y="94">02</text>
    <text x="1228" y="94">03</text>
    <text x="392" y="350">04</text>
    <text x="810" y="350">05</text>
    <text x="1228" y="350">06</text>
  </g>

  <g font-size="26" font-weight="700" fill="#F4F5F0">
    <text x="52" y="160">Моя волна</text>
    <text x="470" y="160">Плеер</text>
    <text x="888" y="160">Коллекция</text>
    <text x="52" y="416">Караоке</text>
    <text x="470" y="416">Источники</text>
    <text x="888" y="416">Оформление</text>
  </g>

  <g font-size="15.5" fill="#9BA0A8">
    <text x="52" y="194">Рекомендации Яндекса без повторов.</text>
    <text x="52" y="218">Режимы колесом и волна SoundCloud.</text>
    <text x="470" y="194">Фон, уведомление, экран блокировки.</text>
    <text x="470" y="218">Эквалайзер, таймер сна, очередь.</text>
    <text x="888" y="194">Любимое, плейлисты, артисты, файлы.</text>
    <text x="888" y="218">Офлайн-загрузки с докачкой.</text>
    <text x="52" y="450">Синхронный текст LRCLIB и Яндекса.</text>
    <text x="52" y="474">Подсветка строки, перемотка тапом.</text>
    <text x="470" y="450">Яндекс Музыка, SoundCloud, файлы.</text>
    <text x="470" y="474">Нет трека в одном — ищем в другом.</text>
    <text x="888" y="450">Material 3, Material You, AMOLED.</text>
    <text x="888" y="474">10 акцентов, 10 значков, RU / EN.</text>
  </g>
</svg>
