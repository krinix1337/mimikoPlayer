    <text x="66" y="186" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#F2F3F5">Волна</text>
    <text x="66" y="224" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="19.5" fill="#A9AFBB">Настроение, энергия и язык станции.</text>
    <text x="66" y="251" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="19.5" fill="#A9AFBB">Очередь догружается сама, без повторов.</text>
  </g>
