    <text x="66" y="186" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#17191C">Волна</text>
    <text x="66" y="224" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="19.5" fill="#5D6168">Настроение, энергия и язык станции.</text>
    <text x="66" y="251" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="19.5" fill="#5D6168">Очередь догружается сама, без повторов.</text>
  </g>
