<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" font-family="'Google Sans', 'Segoe UI Variable Display', 'Segoe UI', Roboto, -apple-system, Arial, sans-serif">
